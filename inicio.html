<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonido Vivo</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<img src="Logo.png" alt="Logo de mi sitio." class="logo-esquina">

<body>
  <header class="title">
    <h1>Bienvenido a Sonido Vivo</h1>
    <p>Descubre el poder de la música y llévate tu sonido al siguiente nivel</p>
  </header>

  <div class="container">
    <h1>Iniciar Sesión</h1>
    <form>
      <div class="input-box">
        <input type="text" placeholder="Nombre de usuario" required>
        <i class="bx bx-user"></i>
      </div>

      <div class="input-box">
        <input type="password" placeholder="Contraseña" required>
        <i class="bx bx-lock-alt"></i>
      </div>

      <div class="remember-password">
        <label><input type="checkbox">Recordarme</label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="btn">Ingresar</button>
      <p class="register_link">¿Todavía no tienes una cuenta?<a href="#">Regístrate</a></p>
    </form>
  </div>

  <div class="menu-container">
    <button class="menu-btn">Menú &#9776;</button>
    <div class="dropdown-content">
      <a href="VolverPaginaInicio1">Página de Inicio</a>
      <a href="Salir">Favoritos</a>
    </div>
  </div>

  <footer>
    <p style="color: white;">&copy; Todos los derechos reservados a Sonido Vivo.</p>
  </footer>
</body>
</html>
